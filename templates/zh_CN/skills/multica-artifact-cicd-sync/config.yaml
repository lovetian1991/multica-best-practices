# multica-artifact-cicd-sync — 编排配置（无凭据）
version: "1.1"

defaults:
  environment: sit       # dev | sit
  upload_evidence: false

# Issue 前缀 → 默认触发哪些 service（见 multica-platform-jenkins/jobs-catalog.yaml）
# 注意：以下为示例映射，请按你团队的「Issue 前缀 → Jenkins 服务」替换为真实配置。
issue_service_map:
  <ISSUE_PREFIX_A>:
    dev: [<service-a>]
    sit: [<service-a>]
  <ISSUE_PREFIX_B>:
    dev: [<service-b1>, <service-b2>]
    sit: [<service-b1>, <service-b2>]
  <ISSUE_PREFIX_C>:
    dev: [<service-c>]
    sit: [<service-c>]
  <ISSUE_PREFIX_D>:
    dev: [<service-d>]
    sit: [<service-d>]

opencontent:
  artifact_type: cicd
