# multica-artifact-req-sync 编排默认值。
# OpenContent 根目录、允许列表和目录名见 multica-platform-opencontent/config.yaml。
version: "2.0"

defaults:
  artifact_type: requirement
  file_model: UPLOAD
  update_strategy: majorUpgrade
  local_draft_pattern: "docs/requirements/<ISSUE-KEY>/prd-<功能名称>.md"

# Issue 字段、metadata、property 和评论均由 Multica 保存，不在此声明外部字段。
prd_template:
  sections:
    - "需求背景"
    - "需求目标"
    - "需求范围"
    - "功能详情"
    - "验收标准"
    - "上线时间"
    - "相关链接"
